name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_actor:
        description: Test the guard only. GitHub user name to pretend made the last commits (nothing is undone).
        required: false
      test_base:
        description: Test the guard only. Commit to compare from (default is the commit before the latest).
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    # Undoes site-code changes pushed without an owner's approval, and reports changes to other
    # people's entries to Discord. Runs before the build so an undone change is never published.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      reverted: ${{ steps.guard.outputs.reverted }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - id: guard
        name: Check who changed what
        run: node scripts/guard.mjs
        env:
          ACTOR: ${{ inputs.test_actor || github.actor }}
          BASE: ${{ inputs.test_base || github.event.before || 'HEAD~1' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.test_actor != '' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_DEVLOG_ALERTS_WEBHOOK: ${{ secrets.DISCORD_DEVLOG_ALERTS_WEBHOOK }}
          DEVLOG_PEOPLE: ${{ vars.DEVLOG_PEOPLE }}

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip, so anything the guard undid is left out
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Check entries
        run: npm run validate
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    # Runs after the site is live, so the link in Discord always works.
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/announce.mjs "${{ github.event.before }}" "${{ github.sha }}"
        env:
          DISCORD_DEVLOG_WEBHOOK: ${{ secrets.DISCORD_DEVLOG_WEBHOOK }}
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
