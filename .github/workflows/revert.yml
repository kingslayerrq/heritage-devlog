name: Prepare revert for review

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full lowercase 40-character SHA of a single-parent main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: owner-revert
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor_id == '22969898'
    runs-on: ubuntu-latest
    environment: devlog-publishing
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Only trusted main code runs. Git uses this short-lived token for one
          # create-only branch push; the script never updates main.
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare a draft PR for owner review
        run: node scripts/native-revert.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
